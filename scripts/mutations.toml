# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/chatgpt_share_reader/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "every enqueued chunk is joined"
file = "src/chatgpt_share_reader/share.py"
find = 'stream = "".join\(json.loads\(chunk\) for chunk in chunks\)'
replace = 'stream = json.loads(chunks[0])'

[[rule]]
name = "object keys name an entry in the array"
file = "src/chatgpt_share_reader/share.py"
find = 'name = self.arr\[int\(key\[1:\]\)\] if key.startswith\("_"\) else key'
replace = 'name = key'

[[rule]]
name = "citation markers are removed"
file = "src/chatgpt_share_reader/share.py"
find = 'return PRIVATE_USE_RE.sub\("", CITE_RE.sub\("", text\)\).strip\(\)'
replace = 'return text.strip()'

[[rule]]
name = "hidden messages are left out"
file = "src/chatgpt_share_reader/share.py"
find = 'if not message or \(is_hidden\(message\) and not include_hidden\):'
replace = 'if not message:'
